name: Build Sonara APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project and add Sonara patch
        run: |
          [ -f DarxTune-lite.zip ] || { echo "DarxTune-lite.zip is missing from the repo"; ls; exit 1; }
          [ -f Sonara.zip ] || { echo "Sonara.zip is missing from the repo"; ls; exit 1; }
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q DarxTune-lite.zip -d "$RUNNER_TEMP/proj"
          GRADLEW=$(find "$RUNNER_TEMP/proj" -name gradlew | head -n 1)
          [ -n "$GRADLEW" ] || { echo "No gradlew inside DarxTune-lite.zip"; exit 1; }
          PROJ=$(dirname "$GRADLEW")
          unzip -q -o Sonara.zip -d "$PROJ"
          echo "PROJECT_DIR=$PROJ" >> "$GITHUB_ENV"

      - name: Apply Sonara patch
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 scripts/apply_sonara.py
          python3 scripts/apply_sonara_ui.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/core/debug/*.apk

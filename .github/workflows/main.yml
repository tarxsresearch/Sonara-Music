name: Build Sonara APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "InterTune branch to build"
        default: "visionos-fix"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get InterTune source and add Sonara patch
        run: |
          [ -f Sonara.zip ] || { echo "Sonara.zip is missing from the repo root"; ls; exit 1; }
          git clone --depth 1 --branch "${{ inputs.branch }}" --recurse-submodules --shallow-submodules \
            https://github.com/ItzSkyeYT/InterTune.git "$RUNNER_TEMP/src"
          unzip -q -o Sonara.zip -d "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src"
          python3 scripts/apply_sonara_online.py
          echo "SRC_DIR=$RUNNER_TEMP/src" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build debug APK
        working-directory: ${{ env.SRC_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-APK
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/core/debug/*.apk
